<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P.A.C.S ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #4a3558; --soft: #8a7398; --faint: #bba9c6;
  --pink: #ff7eb6; --pink-2: #ffd6e8; --pink-3: #fff0f6;
  --lav: #a98bff; --lav-2: #e4dbff; --lav-3: #f6f2ff;
  --mint: #3dd6a3; --mint-2: #c9f5e4; --mint-3: #effdf7;
  --butter: #ffb547; --butter-2: #ffe8bf; --butter-3: #fff8ea;
  --red: #ff5c7a; --green: #23c48e;
  --card: rgba(255, 255, 255, .82);
  --round: 'M PLUS Rounded 1c', 'Segoe UI', system-ui, sans-serif;
  --bubble: 'Baloo 2', 'M PLUS Rounded 1c', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  color: var(--ink); font: 14px/1.5 var(--round);
  background: #fff3f9;
  background-image:
    radial-gradient(circle at 8% 12%, #ffd6ec 0, transparent 38%),
    radial-gradient(circle at 92% 8%, #e6ddff 0, transparent 40%),
    radial-gradient(circle at 85% 92%, #d2f7e8 0, transparent 42%),
    radial-gradient(circle at 10% 90%, #fff0c9 0, transparent 40%);
  background-attachment: fixed;
  overflow-x: hidden;
}
/* drifting sparkles */
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.sky span { position: absolute; font-size: 18px; opacity: .45; animation: drift 14s ease-in-out infinite; }
@keyframes drift { 0%,100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(-22px) rotate(12deg) } }
@media (prefers-reduced-motion: reduce) { .sky span, .heart, .cat { animation: none !important; } }

button, input, select, textarea { font: inherit; color: inherit; }
header {
  position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 18px; margin: 12px 14px 0; border-radius: 22px; background: var(--card);
  box-shadow: 0 6px 24px rgba(255, 126, 182, .18); border: 2px solid #fff;
}
.logo { font: 800 26px/1 var(--bubble); letter-spacing: 1px; background: linear-gradient(90deg, var(--pink), var(--lav), var(--mint)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.heart { color: var(--pink); font-size: 18px; animation: beat 1.4s infinite; display: inline-block; }
.heart.thinking { color: var(--butter); animation-duration: .5s; }
@keyframes beat { 0%,100% { transform: scale(1) } 15% { transform: scale(1.35) } 30% { transform: scale(1) } }
.spacer { flex: 1; }
.pill { border: 2px solid var(--lav-2); background: #fff; border-radius: 99px; padding: 4px 12px; font-size: 12.5px; font-weight: 700; color: var(--soft); cursor: pointer; transition: transform .15s, background .15s; white-space: nowrap; }
.pill:hover { transform: translateY(-1px) scale(1.03); }
.pill.on { background: var(--lav); border-color: var(--lav); color: #fff; }
.pill.on.paused { background: var(--red); border-color: var(--red); }
.pill.on.review { background: var(--butter); border-color: var(--butter); }
.pill.live { background: var(--red); border-color: var(--red); color: #fff; }
.pill.paper { background: var(--mint-3); border-color: var(--mint-2); color: #1c9c72; }
.group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.label { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; }
select.pill { appearance: none; padding-right: 26px; background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23a98bff'/></svg>") no-repeat right 10px center; }

main {
  position: relative; z-index: 1; display: grid; gap: 14px; padding: 14px;
  grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  height: calc(100vh - 86px); min-height: 640px;
}
@media (max-width: 960px) { main { grid-template-columns: 1fr; grid-template-rows: none; height: auto; } .pane { min-height: 480px; max-height: 80vh; } }
@media (max-width: 600px) { header { margin: 10px 16px 0; } main { padding: 12px 16px; } }

.pane {
  --c: var(--pink); --c2: var(--pink-2); --c3: var(--pink-3);
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background: var(--card); border-radius: 28px; border: 3px solid #fff;
  box-shadow: 0 10px 30px color-mix(in srgb, var(--c) 22%, transparent), inset 0 0 0 2px var(--c2);
  overflow: hidden; backdrop-filter: blur(6px);
}
.pane.p2 { --c: var(--lav); --c2: var(--lav-2); --c3: var(--lav-3); }
.pane.p3 { --c: var(--mint); --c2: var(--mint-2); --c3: var(--mint-3); }
.pane.p4 { --c: var(--butter); --c2: var(--butter-2); --c3: var(--butter-3); }
.pane > h2 {
  margin: 0; padding: 12px 18px 10px; display: flex; align-items: center; gap: 8px;
  font: 800 19px/1.1 var(--bubble); color: var(--ink);
  background: linear-gradient(180deg, var(--c3), transparent); border-bottom: 2px dashed var(--c2);
}
.pane > h2 .n { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; font-size: 14px; }
.pane > h2 .sub { margin-left: auto; font: 500 12px var(--round); color: var(--soft); }
.body { flex: 1; overflow: auto; padding: 12px 16px 16px; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--c2) transparent; }

.btn { border: 0; border-radius: 99px; padding: 6px 14px; background: var(--c); color: #fff; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 60%, #000 10%); transition: transform .1s; white-space: nowrap; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.ghost { background: #fff; color: var(--soft); box-shadow: inset 0 0 0 2px var(--c2); }
.btn.no { background: #fff; color: var(--red); box-shadow: inset 0 0 0 2px #ffd0da; }
.btn.small { padding: 3px 10px; font-size: 12px; }
.field { flex: 1; min-width: 0; border: 2px solid var(--c2); border-radius: 16px; padding: 8px 12px; background: #fff; outline: none; }
.field:focus { border-color: var(--c); }
.row { display: flex; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.dim { color: var(--soft); font-size: 12px; }
.faint { color: var(--faint); font-size: 12px; }
.empty { text-align: center; color: var(--faint); padding: 18px 8px; }
.empty b { display: block; font-size: 28px; }
.up { color: var(--green); font-weight: 700; } .down { color: var(--red); font-weight: 700; }
.sec { font: 800 14px var(--bubble); margin: 14px 0 6px; display: flex; align-items: center; gap: 6px; }
.card { background: #fff; border-radius: 18px; padding: 10px 12px; box-shadow: 0 2px 0 var(--c2); border: 2px solid var(--c3); overflow-wrap: anywhere; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.tag { display: inline-block; border-radius: 99px; padding: 1px 8px; font-size: 11px; font-weight: 700; background: var(--c3); color: var(--soft); }
.tag.hot { background: #ffe1e8; color: var(--red); }
.tag.her { background: var(--pink-2); color: #d94f8f; }
.switch { position: relative; width: 46px; height: 26px; border-radius: 99px; border: 0; background: #eee3f3; cursor: pointer; transition: background .2s; flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); transition: left .2s; }
.switch.on { background: var(--c); }
.switch.on::after { left: 23px; }
.seg { display: inline-flex; background: var(--c3); border-radius: 99px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 99px; padding: 3px 10px; cursor: pointer; color: var(--soft); font-weight: 700; font-size: 12px; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.approve { border: 2px dashed var(--butter); background: #fffaf0; border-radius: 18px; padding: 10px 12px; }
.approve .why { color: #c47a12; font-size: 12px; margin: 4px 0 8px; }

/* 1. to-do */
.todo { display: flex; align-items: center; gap: 10px; }
.forge { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--lav-3) 70%, transparent); backdrop-filter: blur(6px); }
.forge[hidden] { display: none; }
.forge .box { width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #fff; border-radius: 26px; padding: 22px; box-shadow: 0 18px 50px rgba(120, 80, 160, .25); }
.forge label { display: block; font-weight: 700; margin: 12px 0 4px; }
.forge label small { font-weight: 400; color: var(--faint); }
.forge textarea { width: 100%; box-sizing: border-box; min-height: 54px; resize: vertical; border: 2px solid var(--pink-2); border-radius: 14px; padding: 8px 12px; outline: none; }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--pink-2); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 13px; color: transparent; flex: none; transition: all .2s; }
.check.on { background: var(--pink); border-color: var(--pink); color: #fff; }
.todo .t { flex: 1; }
.todo.done .t { text-decoration: line-through; text-decoration-color: var(--pink); color: var(--faint); }
.note { background: repeating-linear-gradient(transparent 0 22px, var(--pink-3) 22px 23px); border-radius: 16px; padding: 8px 12px; border: 2px solid var(--pink-3); white-space: pre-wrap; font-size: 13px; }

/* 2. thoughts */
.me-card { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; background: linear-gradient(135deg, var(--lav-3), var(--pink-3)); border-radius: 22px; padding: 12px 14px; }
.cat { font: 700 15px/1.2 ui-monospace, Consolas, monospace; white-space: pre; color: var(--lav); }
.blush { color: var(--pink); }
.name { font: 800 22px/1 var(--bubble); }
.bubble-mood { display: inline-block; margin-top: 6px; background: #fff; border-radius: 16px 16px 16px 4px; padding: 4px 12px; font-weight: 700; box-shadow: 0 2px 0 var(--lav-2); }
.meter { display: flex; gap: 2px; font-size: 15px; letter-spacing: -1px; }
.meter i { font-style: normal; filter: grayscale(1); opacity: .25; }
.meter i.full { filter: none; opacity: 1; }
.tabs { display: flex; gap: 6px; margin: 12px 0 8px; flex-wrap: wrap; }
.tabs button { border: 0; border-radius: 99px; padding: 5px 12px; background: var(--c3); color: var(--soft); font-weight: 700; cursor: pointer; }
.tabs button.on { background: var(--c); color: #fff; }
.tabs .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 99px; background: var(--butter); color: #fff; font-size: 11px; margin-left: 4px; }
.msgs { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 86%; padding: 8px 13px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--lav); color: #fff; border-bottom-right-radius: 4px; }
.msg.her { align-self: flex-start; background: #fff; border: 2px solid var(--lav-2); border-bottom-left-radius: 4px; }
.msg.wait { opacity: .6; font-style: italic; }
.thought { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.thought .ic { font-size: 18px; text-align: center; }
.thought .card { padding: 7px 11px; font-size: 13px; }
.chatbar { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 2px dashed var(--lav-2); }

/* 3. fomo */
.lb { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; }
.medal { font-size: 20px; text-align: center; }
.rs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
.rs div { background: var(--mint-3); border-radius: 12px; padding: 4px 8px; text-align: center; }
.rs b { display: block; font-size: 13px; }

/* 4. trades */
.books { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.books .card { text-align: center; padding: 8px; }
.books b { display: block; font: 800 18px var(--bubble); }
.prog { height: 10px; border-radius: 99px; background: var(--butter-3); overflow: hidden; margin-top: 4px; box-shadow: inset 0 0 0 2px var(--butter-2); }
.prog > i { display: block; height: 100%; background: linear-gradient(90deg, var(--butter), var(--pink)); border-radius: 99px; }
.pos { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.pct { font: 800 18px var(--bubble); }

#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 9; background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 99px; font-weight: 700; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <span style="left:6%;top:18%">✦</span><span style="left:22%;top:72%;animation-delay:-3s">♡</span><span style="left:48%;top:8%;animation-delay:-6s">✿</span>
  <span style="left:70%;top:60%;animation-delay:-2s">☆</span><span style="left:90%;top:30%;animation-delay:-8s">♡</span><span style="left:36%;top:44%;animation-delay:-10s">✧</span>
</div>

<header>
  <span class="heart" id="heart">♥</span>
  <span class="logo" title="personal agentic core system">P.A.C.S</span>
  <select class="pill" id="persona" title="who's home"></select>
  <button class="pill" id="forgeBtn" title="forge a new persona">✚ forge</button>
  <span class="pill" id="brain" style="cursor:default">brain</span>
  <span class="spacer"></span>
  <div class="group"><span class="label">vibe check</span><span id="dial" class="group"></span></div>
  <div class="group"><span class="label">for real?</span><span id="modes" class="group"></span></div>
</header>

<main>
  <section class="pane p1">
    <h2><span class="n">1</span> to-do list 🍓 <span class="sub" id="todoSub"></span></h2>
    <div class="body" id="p1"></div>
  </section>

  <section class="pane p2">
    <h2><span class="n">2</span> thoughts, moods &amp; feelings 💭 <span class="sub" id="busy"></span></h2>
    <div class="body" id="p2"></div>
    <form class="chatbar" id="say">
      <input class="field" id="text" autocomplete="off" placeholder="talk to them ♡">
      <button class="btn">send ✧</button>
    </form>
  </section>

  <section class="pane p3">
    <h2><span class="n">3</span> fomo stats &amp; research 📈 <span class="sub" id="fomoSub"></span></h2>
    <div class="body" id="p3"></div>
  </section>

  <section class="pane p4">
    <h2><span class="n">4</span> current trades 💸 <span class="sub" id="tradeSub"></span></h2>
    <div class="body" id="p4"></div>
  </section>
</main>
<div id="toast"></div>
<div id="forge" class="forge" hidden></div>

<script>
const TOKEN = '__PACS_TOKEN__'
let S = null, sending = null, tick = 0
let mindTab = load('pacs.mindTab', 'talk')
const events = []

function load(k, d) { try { return localStorage.getItem(k) || d } catch { return d } }
function save(k, v) { try { localStorage.setItem(k, v) } catch {} }
const $ = id => document.getElementById(id)
/** h('div', {class}, 'text', child): strings always land as text, never HTML. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else if (k === 'style') el.style.cssText = v
    else el.setAttribute(k, v === true ? '' : v)
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c))
  return el
}
async function api(path, body) {
  const r = await fetch(`/api/${path}`, { method: body ? 'POST' : 'GET', headers: { 'x-pacs-token': TOKEN, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
  const j = await r.json()
  if (j.error) { toast(`oops: ${j.error}`); throw new Error(j.error) }
  return j
}
const act = (organ, action, body = {}) => api(`${organ}/${action}`, body).then(r => { refresh(); return r })
let toastT
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3500) }
const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : m < 2880 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago` }
const until = ms => { const m = Math.round((ms - Date.now()) / 60000); return m <= 0 ? 'any moment' : m < 60 ? `in ${m}m` : `in ${(m / 60).toFixed(1)}h` }
const usd = n => { const a = Math.abs(n || 0); const s = a >= 1e6 ? `$${(a / 1e6).toFixed(2)}M` : a >= 1e3 ? `$${(a / 1e3).toFixed(1)}k` : `$${a.toFixed(0)}`; return n < 0 ? `-${s}` : s }
const sign = n => `${n >= 0 ? '+' : ''}${n.toFixed(4)}`
const empty = (emoji, text) => h('div', { class: 'empty' }, h('b', {}, emoji), text)
const sw = (on, onclick, title) => h('button', { class: `switch ${on ? 'on' : ''}`, onclick, title, 'aria-pressed': on ? 'true' : 'false' })
/** Don't redraw a pane while the person is typing in it. */
const typingIn = id => document.activeElement && document.activeElement !== document.body && $(id).contains(document.activeElement) && document.activeElement.tagName === 'INPUT'

// ---------- header ----------
function header() {
  $('heart').className = `heart ${S.busy ? 'thinking' : ''}`
  $('brain').textContent = S.brain === 'cli' ? '🧠 claude -p' : S.brain === 'api' ? '🧠 api' : `🧠 ${S.brain}`
  const c = S.organs.conscience.view
  $('dial').replaceChildren(...[['auto', '🌸 auto'], ['review', '👀 review'], ['paused', '💤 paused']].map(([d, label]) =>
    h('button', { class: `pill ${c.dial === d ? `on ${d}` : ''}`, title: d === 'auto' ? 'rules + reviewer decide; flagged things wait for you' : d === 'review' ? 'everything waits for you' : 'nothing leaves the body',
      onclick: () => act('conscience', 'dial', { dial: d }) }, label)))
  $('modes').replaceChildren(...[['voice', '💌 posts'], ['hands', '💸 trades']].map(([o, label]) =>
    h('button', { class: `pill ${c.live[o] ? 'live' : 'paper'}`, title: 'paper = pretend, LIVE = real',
      onclick: () => {
        const goLive = !c.live[o]
        if (goLive && !confirm(o === 'voice' ? 'Go LIVE on X? Their posts will really publish.' : 'Go LIVE trading? Real BNB gets spent, within your limits.')) return
        act('conscience', 'live', { organ: o, isLive: goLive })
      } }, `${label}: ${c.live[o] ? 'LIVE 🔥' : 'paper 🧸'}`)))
  const idv = S.organs.identity.view, sel = $('persona')
  if (document.activeElement !== sel) sel.replaceChildren(...idv.personas.map(p => h('option', { value: p.id, selected: idv.active?.id === p.id }, `✿ ${p.name}`)))
}

function approvals(organ) {
  const c = S.organs.conscience.view
  return c.pending.filter(p => p.organ === organ).map(p => h('div', { class: 'approve' },
    h('div', { class: 'row between' }, h('b', {}, `🙏 waiting for you · ${p.kind}`), h('span', { class: 'faint' }, ago(p.at))),
    h('div', {}, p.summary),
    h('div', { class: 'why' }, `why it's held: ${p.reasons.join(' · ')}`),
    h('div', { class: 'row', style: 'justify-content:flex-end' },
      h('button', { class: 'btn no small', onclick: () => act('conscience', 'reject', { id: p.id }) }, 'nope ✕'),
      h('button', { class: 'btn small', style: '--c: var(--mint)', onclick: () => act('conscience', 'approve', { id: p.id }) }, `ok! ${c.live[organ] ? '(LIVE)' : '(paper)'}`))))
}

// ---------- 1. to-do ----------
function p1() {
  const a = S.organs.agenda.view
  const open = a.todos.filter(t => !t.isDone).length
  $('todoSub').textContent = `${open} open · ${a.todos.length - open} done`
  if (typingIn('p1')) return
  keep('p1', () => [
    h('form', { class: 'row', onsubmit: e => { e.preventDefault(); const v = $('todoIn').value.trim(); if (v) act('agenda', 'add', { text: v }); $('todoIn').value = '' } },
      h('input', { class: 'field', id: 'todoIn', placeholder: 'a goal for them ✿', autocomplete: 'off' }), h('button', { class: 'btn' }, 'add ♡')),
    h('div', { class: 'stack', style: 'margin-top:10px' }, a.todos.length ? [...a.todos].sort((x, y) => x.isDone - y.isDone).map(t =>
      h('div', { class: `card todo ${t.isDone ? 'done' : ''}` },
        h('button', { class: `check ${t.isDone ? 'on' : ''}`, onclick: () => act('agenda', 'toggle', { id: t.id }), 'aria-label': 'toggle' }, '♥'),
        h('span', { class: 't' }, t.text), t.by === 'agent' ? h('span', { class: 'tag her' }, 'theirs 🎀') : null,
        h('button', { class: 'btn ghost small', onclick: () => act('agenda', 'remove', { id: t.id }), 'aria-label': 'remove' }, '✕')))
      : empty('🌱', 'nothing on the list yet!')),
    h('div', { class: 'sec' }, '💗 heartbeat', h('span', { class: 'faint' }, `${a.heart.beats} beats`)),
    h('div', { class: 'card row wrap' },
      sw(a.heart.isOn, () => act('agenda', 'heart', { isOn: !a.heart.isOn })),

const FACE = { euphoric: '^w^', hyped: '*o*', restless: 'o_o', tilted: '>_<', content: '^_^', focused: 'o.o', meh: '-_-', salty: '>.>', cozy: 'u_u', sleepy: '-.-', devastated: 'T_T' }
function cat(mood, working) {
  const t = tick % 32, tail = ['~', '-', '~', '_'][Math.floor(tick / 2) % 4], ears = '  /\\_/\\'
  if (working) return `${ears} ${['♪  ', '♪♪ ', '♪♪♪', ' ♪♪'][tick % 4]}\n ( ${tick % 4 < 2 ? 'o.O' : 'O.o'} )\n ${tick % 2 ? ' _<_^_>_ ' : ' _>_^_<_ '}`
  const b = FACE[mood] || 'o.o'
  let f = ` ( ${b} )`
  if (t === 9 || t === 21 || t === 23) f = ' ( -.- )'
  else if (t >= 13 && t <= 15) f = ` (${b}  )`
  else if (t >= 16 && t <= 18) f = ` (  ${b})`
  return `${ears}\n${f}\n${Math.floor(tick / 4) % 2 ? '  >   <' : '  > ^ <'}  ${tail}`
}
const meter = (n, full, emptyIcon) => h('span', { class: 'meter' }, Array.from({ length: 5 }, (_, i) => h('i', { class: i < Math.round(n * 5) ? 'full' : '' }, i < Math.round(n * 5) ? full : emptyIcon)))

const THOUGHT_ICON = { 'turn.start': '💡', 'turn.text': '💭', 'tool.call': '🔧', 'tool.result': '✨', 'memory.added': '📝', mood: '💗', stance: '🌟', 'act.hold': '🙏', 'act.block': '🚫', 'act.done': '✅', 'turn.error': '😵', research: '🔍', trade: '💸', posted: '💌', 'exit.stuck': '⏳', 'act.failed': '😵', topic: '🎲', trigger: '⚡', newsjack: '📰', crisis: '🚨', story: '📖', lore: '✨', measured: '📈' }
function thoughtText(s) {
  const d = s.data || {}
  switch (s.type) {
    case 'turn.start': return `${d.kind === 'chat' ? 'you said' : `woke up for a ${d.kind}`}: ${String(d.text).slice(0, 160)}`
    case 'turn.text': return d.text
    case 'tool.call': return `using ${d.name}…`
    case 'tool.result': return `${d.name} → ${d.result}`
    case 'memory.added': return `remembered: ${d.texts.join(' · ')}`
    case 'mood': return `${d.emoji} feeling ${d.label}: ${d.what}`
    case 'stance': return `${d.change} a stance on ${d.topic}: ${d.stance}`
    case 'turn.error': return `stumbled: ${d.error}`
    case 'research': return `looked at $${d.symbol}: ${d.line}`
    case 'trade': return `${d.paper ? 'paper' : 'LIVE'} ${d.side} $${d.symbol} · ${d.bnb.toFixed(4)} BNB`
    case 'posted': return `${d.mode} post: ${d.text}`
    case 'exit.stuck': return `couldn't ${d.why} on $${d.symbol}: ${d.result}. retrying slower`
    case 'topic': return `next post is about: ${d.topic}${d.blend ? ` × ${d.blend}` : ''} (${String(d.format).split(':')[0]})`
    case 'trigger': return d.text
    case 'newsjack': return `breaking: ${d.title} (${(d.sources || []).join(', ')})`
    case 'crisis': return d.why
    case 'story': return `new chapter: ${(d.chapters || []).join('; ')}`
    case 'lore': return `lore grew: ${(d.added || []).join('; ')}`
    case 'measured': return `read their numbers: ${d.posts} posts, ${d.followers} followers`
    default: return s.type.startsWith('act.') ? `${d.organ}.${d.kind} ${s.type.slice(4)}: ${d.summary}` : null
  }
}

          h('span', { class: 'faint' }, `/day · ${!sc.api ? 'no FOMO_API_KEY' : sc.live?.isOpen ? `● fomo live stream (${(sc.live.events ?? 0).toLocaleString()} events)` : `○ fomo stream ${sc.live?.status ?? 'connecting'}`}`)),
        h('div', { class: 'faint', style: 'margin:6px 0' }, `warehouse: ${sc.counts.trades.toLocaleString()} trades · ${sc.counts.wallets.toLocaleString()} fomo traders · ${sc.counts.tokens} tokens${sc.summary ? ` · ${sc.summary.wallets} profiled, ${sc.summary.clusters} clusters` : ''}`),
        groups.length ? h('div', { class: 'stack' }, groups.flatMap(([tier, list]) => [
          h('div', { class: 'dim', style: 'margin-top:4px' }, TIER[tier] ?? tier),
          ...list.slice(0, 3).map(p => h('details', { class: 'card' },
            h('summary', { style: 'cursor:pointer' }, h('b', {}, p.short), h('span', { class: 'faint' }, ` · score ${p.score}${p.labels.length ? ` · ${p.labels.join(', ')}` : ''}${p.isLeader ? ` · leads cluster #${p.cluster}` : ''}`)),
            h('div', { class: 'stack', style: 'margin-top:4px' }, p.reasons.map(r => h('div', { class: 'faint' }, `• ${r}`)))))])) : h('div', { class: 'faint' }, 'no radar wallets yet: profiles need a few days of trades (3+ tokens per wallet).'),
        sc.signals.length ? h('div', { class: 'stack', style: 'margin-top:8px' }, sc.signals.slice(0, 5).map(s => h('div', { class: 'faint' },
          `${s.copied ? '🛒 copied' : s.skip ? '💤' : '👀'} ${s.wallet} → $${s.symbol ?? '?'} · signal ${s.score}${s.skip ? ` · ${s.skip}` : ''}${s.outcome?.r1h != null ? ` · 1h ${s.outcome.r1h >= 0 ? '+' : ''}${(s.outcome.r1h * 100).toFixed(0)}%` : ''} · ${ago(s.at)}`))) : null,
        h('div', { class: 'row', style: 'margin-top:6px' },
          h('button', { class: 'btn ghost small', onclick: () => act('scout', 'collectNow', {}).then(r => toast(String(r.value?.result ?? '').slice(0, 140))) }, 'collect now'),
          h('button', { class: 'btn ghost small', onclick: () => act('scout', 'scoreNow', {}).then(r => toast(String(r.value?.result ?? '').slice(0, 140))) }, 'rescore')))
    })(),
    h('div', { class: 'sec' }, '📰 what is happening'),
    v.digest?.narratives?.length ? h('div', { class: 'card stack' },
      h('span', { class: 'faint' }, `today's narratives · ${ago(v.digest.at)}`),
      ...v.digest.narratives.map(n => h('div', {}, h('b', {}, n.name), h('span', { class: 'faint' }, ` · ${n.why} (${n.sources.join(', ')})`)))) : null,
    v.newsjack ? h('div', { class: 'card row wrap', style: 'margin-top:8px' }, sw(v.newsjack.isOn, () => act('eyes', 'newsjack', { isOn: !v.newsjack.isOn })),
      h('span', {}, 'react to breaking news in their niche'), h('span', { class: 'faint' }, `· up to ${v.newsjack.perDay}/day · always waits for your approval`),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn ghost small', onclick: () => act('eyes', 'newsNow', {}).then(r => toast(String(r.value?.result ?? '').slice(0, 120))) }, 'refresh'),
      h('button', { class: 'btn ghost small', onclick: () => act('eyes', 'digestNow', {}).then(r => toast(String(r.value?.result ?? '').slice(0, 120))) }, 'digest now')) : null,
    (v.stories || []).length ? h('div', { class: 'stack', style: 'margin-top:8px' }, v.stories.slice(0, 8).map(s => h('div', { class: 'card' },
      h('div', {}, s.link ? h('a', { href: s.link, target: '_blank', rel: 'noopener' }, s.title) : s.title),
      h('div', { class: 'faint' }, `${s.sources.join(', ')} · ${s.confidence}${s.relevance ? ` · their niche ${'♡'.repeat(Math.min(3, s.relevance))}` : ''} · ${ago(s.at)}`)))) : h('div', { class: 'faint', style: 'margin-top:6px' }, 'headlines arrive every 30 minutes.'),
    h('div', { class: 'sec' }, '🔍 research'),
    h('form', { class: 'row', onsubmit: e => { e.preventDefault(); const t = $('lookIn').value.trim(); if (!t) return; act('eyes', 'market', { token: t }).then(() => { $('lookIn').value = '' }).catch(() => {}) } },
      h('input', { class: 'field', id: 'lookIn', placeholder: 'paste a BNB Chain token 0x…', autocomplete: 'off' }), h('button', { class: 'btn' }, 'look 👀')),
    h('div', { class: 'stack', style: 'margin-top:8px' }, (v.research || []).length ? v.research.map(r => h('div', { class: 'card' },
      h('div', { class: 'row between' }, h('b', {}, `$${r.symbol}`),
        h('span', { class: 'row' }, h('span', { class: `tag ${r.by === 'agent' ? 'her' : ''}` }, r.by === 'agent' ? 'they looked 🎀' : 'you looked'), h('span', { class: 'faint' }, ago(r.at)))),
      r.priceUsd != null ? h('div', { class: 'rs' },
        h('div', {}, h('span', { class: 'faint' }, 'mcap'), h('b', {}, usd(r.marketCapUsd))),
        h('div', {}, h('span', { class: 'faint' }, 'liquidity'), h('b', {}, usd(r.liquidityUsd))),
        h('div', {}, h('span', { class: 'faint' }, '24h'), h('b', { class: r.change24hPct >= 0 ? 'up' : 'down' }, `${r.change24hPct >= 0 ? '+' : ''}${r.change24hPct}%`))) : null,
      h('div', { class: 'faint', style: 'margin-top:6px' }, r.line),
      h('div', { class: 'faint' }, r.token))) : empty('🔍', 'nothing researched yet')),
  ])
}

// ---------- 4. current trades ----------
function p4() {
  const v = S.organs.hands.view, l = v.limits, live = S.organs.conscience.view.live.hands
  $('tradeSub').textContent = live ? 'LIVE 🔥' : 'paper 🧸'
  if (typingIn('p4')) return
  // Paper and live keep separate books: show the ones new buys go into, and mention the other if it's busy.
  const mode = v.mode, d = v.day[mode], other = mode === 'live' ? 'paper' : 'live', od = v.day[other]
  const open = v.positions.filter(p => p.paper === (mode === 'paper')).length
  keep('p4', () => [
    h('div', { class: 'dim', style: 'margin-bottom:6px' }, `today's ${mode} books ${mode === 'live' ? '🔥' : '🧸'}`),
    h('div', { class: 'books' },
      h('div', { class: 'card' }, h('span', { class: 'faint' }, 'spent today'), h('b', {}, `${d.spentBnb.toFixed(3)}`),
        h('div', { class: 'prog' }, h('i', { style: `width:${Math.min(100, (d.spentBnb / l.maxDailyBnb) * 100)}%` })), h('span', { class: 'faint' }, `of ${l.maxDailyBnb} BNB`)),
      h('div', { class: 'card' }, h('span', { class: 'faint' }, 'realized'), h('b', { class: d.realizedBnb >= 0 ? 'up' : 'down' }, sign(d.realizedBnb)), h('span', { class: 'faint' }, `stop at -${l.maxDailyLossBnb}`)),
      h('div', { class: 'card' }, h('span', { class: 'faint' }, 'open'), h('b', {}, `${open}/${l.maxOpen}`), h('span', { class: 'faint' }, 'positions'))),
    od.spentBnb || od.realizedBnb ? h('div', { class: 'faint', style: 'margin-top:4px' }, `${other} today: spent ${od.spentBnb.toFixed(3)} · realized ${sign(od.realizedBnb)}`) : null,
    v.stuck.length ? h('div', { class: 'approve', style: 'margin-top:8px' }, h('b', {}, '⏳ an exit keeps failing'),
      h('div', { class: 'why' }, `${v.stuck.map(s => s.key.split(':')[0]).join(', ')} · retrying with backoff, next ${until(Math.min(...v.stuck.map(s => s.retryAt)))}. See the thoughts feed.`)) : null,
    ...approvals('hands'),
    h('div', { class: 'card row wrap', style: 'margin-top:10px' }, sw(v.scan, () => act('hands', 'scan', { isOn: !v.scan })),
      h('span', {}, 'copy-scan fomo top traders'), h('span', { class: 'faint' }, '· they judge each signal themselves')),
    v.cycle ? h('div', { class: 'card', style: 'margin-top:8px' },
      h('div', { class: 'row wrap' }, sw(v.cycle.isOn, () => act('hands', 'cycle', { isOn: !v.cycle.isOn })),
        h('span', {}, '⏰ trade every'),
        h('input', { class: 'field', style: 'flex:none;width:56px;padding:4px 8px', value: v.cycle.everyHours, onchange: e => act('hands', 'cycle', { everyHours: Number(e.target.value) }) }),
        h('span', {}, 'h'),
        h('span', { class: 'faint' }, v.cycle.isOn ? `· next ${until(v.cycle.nextAt)}` : '· off'),
        h('button', { class: 'btn small', onclick: () => act('hands', 'cycleNow', {}) }, 'run one now')),
      v.cycle.log.length ? h('div', { class: 'stack', style: 'margin-top:6px' }, v.cycle.log.slice(0, 4).map(c => h('div', { class: 'faint' },
        `${c.did === 'buy' ? '🛒' : c.did === 'sell' ? '🔁' : '💤'} ${ago(c.at)} · ${c.mode} · ${c.summary}${c.did === 'skip' && c.result && c.result !== 'no trade' ? ` (${c.result.slice(0, 140)})` : ''}`))) : null) : null,
    h('div', { class: 'sec' }, '🛍️ holding'),
    v.positions.length ? h('div', { class: 'stack' }, v.positions.map(p => {
      const c = (p.lastPrice / p.entryPrice - 1) * 100
      return h('div', { class: 'card pos' },
        h('div', {}, h('b', {}, `$${p.symbol} `), h('span', { class: `tag ${p.paper ? '' : 'hot'}` }, p.paper ? 'paper 🧸' : 'LIVE 🔥'), p.tookProfit ? h('span', { class: 'tag' }, ' half taken · trailing') : null,
          p.copy ? h('span', { class: 'tag her', title: `copied ${p.copy.wallets.map(w => w.slice(0, 6) + '…' + w.slice(-4)).join(', ')} · signal ${p.copy.score}` }, ` 🕵️ copy · ladder ${p.copy.stage}/2${p.copy.leaderSoldPct ? ' · leader selling' : ''}`) : null),
        h('span', { class: `pct ${c >= 0 ? 'up' : 'down'}` }, `${c >= 0 ? '+' : ''}${c.toFixed(1)}% ${c >= 0 ? '🚀' : '🥲'}`),
        h('span', { class: 'faint' }, `cost ${p.costBnb.toFixed(4)} BNB · opened ${ago(p.openedAt)}`),
        h('button', { class: 'btn no small', onclick: () => confirm(`Sell all $${p.symbol} (${p.paper ? 'paper' : 'LIVE'})?`) && act('hands', 'sell', { token: p.token, pct: 100, paper: p.paper }) }, 'sell all'))
    })) : empty('🧺', 'no bags right now'),
    h('div', { class: 'sec' }, '🧾 trade diary'),
    v.trades.length ? h('div', { class: 'stack' }, v.trades.map(t => h('div', { class: 'card' },
      h('div', { class: 'row between' }, h('span', {}, `${t.side === 'buy' ? '🛒 bought' : '💰 sold'} $${t.symbol} · ${t.bnb.toFixed(4)} BNB`),
        t.pnlBnb != null ? h('span', { class: t.pnlBnb >= 0 ? 'up' : 'down' }, sign(t.pnlBnb)) : null),
      h('div', { class: 'faint' }, `${t.paper ? 'paper' : 'LIVE'} · ${t.by === 'exit' ? 'auto exit' : t.by} · ${ago(t.at)}${t.why ? ` · ${t.why}` : ''}`)))) : empty('🧾', 'no trades yet'),
    h('details', { style: 'margin-top:12px' }, h('summary', { class: 'dim', style: 'cursor:pointer' }, '⚙️ limits (enforced in code)'),
      h('div', { class: 'stack', style: 'margin-top:8px' }, Object.entries(l).map(([k, val]) => h('div', { class: 'row between' },
        h('span', { class: 'dim' }, k), h('input', { class: 'field', style: 'flex:none;width:110px;padding:4px 8px', value: val, onchange: e => act('hands', 'limits', { [k]: Number(e.target.value) }) }))),
        h('div', { class: 'row between' }, h('span', { class: 'dim', title: 'many BNB memecoins tax each trade; paper fills take this off both ways' }, 'paper tax %'),
          h('input', { class: 'field', style: 'flex:none;width:110px;padding:4px 8px', value: v.paperTaxPct, onchange: e => act('hands', 'paperTax', { pct: Number(e.target.value) }) })))),
  ])
}

/** Redraws a pane but keeps what the person was looking at: which sections are open, and the scroll. */
function keep(id, build) {
  const box = $(id), top = box.scrollTop
  const open = new Set([...box.querySelectorAll('details[open] > summary')].map(s => s.textContent))
  box.replaceChildren(...[build()].flat(9).filter(Boolean))
  for (const s of box.querySelectorAll('details > summary')) if (open.has(s.textContent)) s.parentElement.open = true
  box.scrollTop = top
}

// ---------- forge: P.A.C.S ships blank; the first persona is written here ----------
const FORGE_QS = [
  ['name', 'name & X handle', 'e.g. Icarus, @IcarusSunCult'],
  ['what', 'what are they?', 'an AI agent sent back in time, a cat who trades, a retired oracle…'],
  ['story', 'backstory', 'where they came from, what they want, what haunts them'],
  ['voice', 'how do they talk?', 'short lines? lowercase? emoji? jokes? solemn? argue with themselves?'],
  ['values', 'what do they care about?', 'convictions they would defend in public'],
  ['never', 'what do they never do?', 'not human and no financial advice are always added for you'],
  ['project', 'a coin or project they carry?', 'name, chain, contract; or leave empty'],
  ['follows', 'accounts they watch closely', 'x handles, space separated'],
]
/** Built once per opening: the 15s refresh must never wipe half-typed answers. */
let forgeOpen = false, forgeBuilt = false
function forge() {
  const box = $('forge'), blank = !S.organs.identity.view.active
  box.hidden = !(blank || forgeOpen)
  if (box.hidden) { forgeBuilt = false; return }
  if (forgeBuilt) return
  forgeBuilt = true
  box.replaceChildren(h('form', { class: 'box', onsubmit: async e => {
    e.preventDefault()
    const f = e.target.elements
    const notes = FORGE_QS.map(([k, label]) => f[k].value.trim() && `${label}: ${f[k].value.trim()}`).filter(Boolean).join('\n')
    if (notes.length < 20) return toast('tell me a little more first ♡')
    f.go.disabled = true; f.go.textContent = 'forging… ✍ (about a minute)'
    try {
      const r = await api('identity/forge', { notes })
      const p = r.value
      toast(`✿ ${p.name} is awake${p.topicsProblems?.length ? ` (topics: ${p.topicsProblems[0]})` : ''}`)
      forgeOpen = false
    } catch { f.go.disabled = false; f.go.textContent = 'forge ✧' } finally { refresh() }
  } },
    h('div', { class: 'logo', style: 'font-size:30px' }, 'P.A.C.S'),
    h('div', { class: 'faint', style: 'margin-top:4px' }, 'personal agentic core system'),
    h('p', {}, blank
      ? 'this body is empty. answer a few questions and the forge writes who lives here: voice, values, taboos, style and a posting catalog. you can edit everything after.'
      : 'forge another persona. it becomes the active one; switch back from the menu up top.'),
    FORGE_QS.map(([k, label, hint]) => [h('label', {}, label, ' ', h('small', {}, hint)), h('textarea', { name: k, rows: k === 'story' || k === 'voice' ? 3 : 2 })]),
    h('div', { class: 'row', style: 'justify-content:flex-end;margin-top:14px;gap:8px' },
      blank ? null : h('button', { class: 'btn ghost', type: 'button', onclick: () => { forgeOpen = false; forge() } }, 'cancel'),
      h('button', { class: 'btn', name: 'go' }, 'forge ✧'))))
}
$('forgeBtn').addEventListener('click', () => { forgeOpen = true; forge() })

// ---------- plumbing ----------
function render() { if (!S) return; header(); p1(); p2(); p3(); p4(); forge() }
let pend
function refresh() { clearTimeout(pend); pend = setTimeout(async () => { try { S = await api('state'); render() } catch {} }, 150) }
function listen() {
  const es = new EventSource(`/api/events?token=${TOKEN}`)
  es.onmessage = e => { events.push(JSON.parse(e.data)); if (events.length > 300) events.shift(); refresh() }
  es.onerror = () => { es.close(); setTimeout(listen, 3000) }
}
$('say').addEventListener('submit', async e => {
  e.preventDefault()
  const text = $('text').value.trim()
  if (!text || sending) return
  sending = text; $('text').value = ''
  if (mindTab !== 'talk') { mindTab = 'talk'; save('pacs.mindTab', 'talk') }
  render()
  try { await api('chat', { text }) } catch {} finally { sending = null; refresh() }
})
$('persona').addEventListener('change', e => act('identity', 'activate', { id: e.target.value }))
setInterval(() => { tick++; const c = $('cat'); if (c && S) c.textContent = cat(S.organs.affect.view.label, !!S.busy) }, 300)
setInterval(refresh, 15000)
refresh(); listen()
</script>
