# Render Blueprint: P.A.C.S as an always-on web service with a small disk for its state. It is a web service (not a
# worker) so the public live window has an address: a read-only WebSocket at /public/ws on Render's PORT. The
# private dashboard still listens on 127.0.0.1 inside the container and is never exposed.
# Secrets are marked sync: false; Render asks for each one when the Blueprint is created.
services:
  - type: web
    name: flapa-live
    runtime: docker
    plan: starter
    branch: main
    autoDeploy: false
    healthCheckPath: /public/health
    disk:
      name: flapa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLAPA_HOME
        value: /var/data/flapa
      - key: FLAPA_BRAIN
        value: cli
      - key: FLAPA_WALLET_MODE
        value: fomo
      - key: FOMO_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: FLAPA_SEED
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false
      - key: FLAPA_TRADER_KEY
        sync: false
      - key: FLAPA_GAS_KEY
        sync: false
      - key: BSC_RPC_URL
        sync: false
      - key: FLAPA_TRADER_MAX_BNB
        sync: false
